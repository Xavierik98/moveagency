  .sig-title { color: #1E9D8B; font-size: 12px; margin: 0 0 6px 0; letter-spacing: 0.5px; text-transform: uppercase; }
  .sig-info a { color: #1E9D8B; text-decoration: none; }
  .sig-info a:hover { text-decoration: underline; }
  .sig-tagline { margin-top: 10px; font-size: 11px; color: #888; font-style: italic; border-top: 1px solid #eee; padding-top: 8px; }
